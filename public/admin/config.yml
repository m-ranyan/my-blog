# Decap CMS 后台配置
backend:
  name: git-gateway
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

locale: zh_Hans

publish_mode: editorial_workflow

collections:
  - name: "posts"
    label: "文章"
    folder: "src/content/posts"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "发布日期", name: "published", widget: "date", format: "YYYY-MM-DD" }
      - { label: "摘要", name: "description", widget: "text", required: false }
      - { label: "标签", name: "tags", widget: "list", required: false, default: [] }
      - { label: "分类", name: "category", widget: "string", required: false }
      - { label: "草稿", name: "draft", widget: "boolean", default: true }
      - { label: "正文", name: "body", widget: "markdown" }
